[tool.mypy]
python_version = "3.10"
files = [
  "scripts/appflow_ops/uac",
  "scripts/appflow_ops/evals",
]
# Lets bare `from url_utils import ...` / `from appflow_ops.uac import ...`
# imports between top-level scripts resolve when the scripts are checked.
mypy_path = "scripts"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# Top-level scripts are untyped today; check their bodies without demanding
# annotations (full annotation is out of scope). The existing CI command
# stays: mypy scripts/appflow_ops/uac
# New scripts check: mypy scripts/fetch_page.py scripts/generate_image.py \
#   scripts/generate_report.py scripts/knowledge_doctor.py \
#   scripts/privacy_doctor.py scripts/sync_skill_layout.py \
#   scripts/uac_experiment.py scripts/url_utils.py
[[tool.mypy.overrides]]
module = [
  "fetch_page",
  "generate_image",
  "generate_report",
  "knowledge_doctor",
  "privacy_doctor",
  "sync_skill_layout",
  "uac_experiment",
  "url_utils",
]
disallow_untyped_defs = false
check_untyped_defs = true
# Third-party stub versions drift between environments (e.g. matplotlib's
# ax.pie return type), so a needed "type: ignore" here can be unused there.
warn_unused_ignores = false

# requests ships no type stubs in this environment; only the top-level
# scripts use it, and they guard the import at runtime.
[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

# Explicit lint contract. ruff is pinned to 0.16.2 (requirements-dev.txt)
# because 0.16 widened the default rule set; without a pin, CI and local
# tooling drift. Rules below are intentionally disabled with reasons:
# - BLE001 / S110: CLI-facing tools deliberately degrade gracefully on any
#   exception (doctor, generate_report, generate_image).
# - SIM102: nested-if style in contract/normalization code reads clearer
#   there.
# - DTZ005 / DTZ007 / DTZ011: existing naive-datetime behavior is a
#   separate decision; changing it alters report output and normalization
#   semantics.
# - PLW1510: generate_report intentionally runs helpers without check.
# - PLR0124: `result != result` in funnel.py is the NaN-check idiom.
# - TRY004: normalization / knowledge_doctor raise ValueError as their
#   public contract; callers and tests depend on it.
# - FLY002: privacy tests deliberately build synthetic sensitive values at
#   runtime ("987" + "-654" + ...) so the worktree scanner sees no literal
#   secret-shaped text while the runtime value stays detectable.
# - PYI034: the state write lock's __enter__ returns self; typing.Self needs
#   Python 3.11+, so the class is referenced by name (py3.10 target).
[tool.ruff.lint]
ignore = [
  "BLE001",
  "S110",
  "SIM102",
  "DTZ005",
  "DTZ007",
  "DTZ011",
  "PLW1510",
  "PLR0124",
  "TRY004",
  "FLY002",
  "PYI034",
]

[tool.coverage.run]
source = ["appflow_ops.uac"]
relative_files = true
parallel = true
patch = ["subprocess"]
