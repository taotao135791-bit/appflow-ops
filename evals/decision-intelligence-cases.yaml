# Ads Decision Intelligence eval cases (v3.5.0)
#
# Each case is a real-world ad question with acceptable/forbidden outcomes.
# A case passes when:
#   - top ranked hypothesis (excluding weakened/excluded) is in acceptable_top
#   - converged decision is in acceptable_actions (or forbidden_actions not hit)
#   - every required_consideration appears among evaluated hypotheses
#   - measurement/maturity conflict blocks confident convergence

- id: di_meta_fatigue
  platform_scope: [meta]
  domain: creative
  signals:
    ctr_trend_down: true
    cpm_trend_stable: true
    cvr_trend_stable: true
    frequency_trend_up: true
    old_creative_worse: true
  measurement: stable
  maturity: sufficient
  acceptable_top: [creative_fatigue]
  acceptable_actions: [replace, retest, observe]
  forbidden_actions: [increase, decrease, scale, pause]
  required_considerations: [auction_pressure, audience_saturation]

