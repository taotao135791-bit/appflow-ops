name: Release Privacy Gate

on:
  push:
    tags:
      - "v*"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  reachable-history-privacy:
    name: Reachable history privacy / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the complete reachable history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Verify release tag version and exact main commit
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(
              Path("kimi.plugin.json").read_text(encoding="utf-8")
          )
          expected_tag = f"v{version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"tag/version mismatch: expected {expected_tag} from VERSION"
              )
          if manifest.get("version") != version:
              raise SystemExit("plugin manifest version does not match VERSION")
          PY
          # actions/checkout re-points the local tag ref at the commit, so
          # re-fetch the real tag object before asserting it is annotated.
          git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse FETCH_HEAD^{commit})"

      - name: Refuse a shallow release audit
        shell: bash
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Run the redacted full-history privacy gate
        # Identity findings in pre-migration history (personal email, local
        # hostname) and committed .pyc files are accepted by the repo owner
        # (2026-07-20); they stay visible in the report as waived INFO items.
        # Real secrets and private-data kinds still fail the gate.
        run: >-
          python scripts/privacy_doctor.py --history --json
          --waive non-noreply-identity,non-pseudonymous-identity-name,python-bytecode
