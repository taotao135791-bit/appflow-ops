name: Release Privacy Gate

on:
  push:
    tags:
      - "v*"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  reachable-history-privacy:
    name: Reachable history privacy / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the complete reachable history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install release-gate dependencies
        # The preflight (release_check.py -> appflow_ops.evals.vague_query)
        # needs PyYAML to validate eval fixtures; keep the gate minimal.
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0.2,<7.0"

      - name: Verify release tag version and exact main commit
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(
              Path("appflow.plugin.json").read_text(encoding="utf-8")
          )
          expected_tag = f"v{version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"tag/version mismatch: expected {expected_tag} from VERSION"
              )
          if manifest.get("version") != version:
              raise SystemExit("plugin manifest version does not match VERSION")
          PY
          # actions/checkout re-points the local tag ref at the commit, so
          # re-fetch the real tag object before asserting it is annotated.
          git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse FETCH_HEAD^{commit})"

      - name: Refuse a shallow release audit
        shell: bash
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Run the scoped-allowlist full-history release gate
        # Identity findings in pre-migration history (owner's personal email
        # as commit/tag identity) and one historical commit of .pyc files are
        # accepted ONLY as exact scoped exceptions in privacy-allowlist.json
        # (value_sha256s and/or commit references). No kind-wide waiver is
        # used: a new email, a new identity, or new bytecode of the same kind
        # still fails the gate. This step runs the same release_check.py
        # preflight the maintainer runs locally before tagging, so local
        # preflight and the GitHub gate cannot drift.
        run: >-
          python scripts/release_check.py --full
          --allowlist privacy-allowlist.json
